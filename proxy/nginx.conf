worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    access_log    /dev/stdout;
    error_log     /dev/stderr warn;

    upstream companies_upstream {
        server companies-service:8000;
    }

    upstream materials_upstream {
        server materials-service:8000;
    }

    upstream frontend_upstream {
        server frontend:80;
    }

    server {
        listen 80;
        server_name _;

        # Rutas estables públicas (el frontend no conoce hosts internos)
        location /api/v1/companies {
            proxy_pass http://companies_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Authorization $http_authorization;
        }

        location /api/v1/materials {
            proxy_pass http://materials_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Authorization $http_authorization;
        }

        location /api/v1/health/companies {
            proxy_pass http://companies_upstream/api/v1/health/;
            proxy_set_header Host $host;
        }

        location /api/v1/health/materials {
            proxy_pass http://materials_upstream/api/v1/health/;
            proxy_set_header Host $host;
        }

        location / {
            proxy_pass http://frontend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
